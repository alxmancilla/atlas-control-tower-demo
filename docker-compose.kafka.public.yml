name: atlas-control-tower-kafka-public

services:
  kafka:
    image: apache/kafka:4.0.2
    ports:
      - "0.0.0.0:9094:9094"
    volumes:
      - "${KAFKA_PUBLIC_SECRETS_DIR:-.local/kafka-public}:/etc/kafka/secrets:ro"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # The official Apache image recognizes the SASL_SSL listener name and uses it
      # to load the keystore/truststore paths from /etc/kafka/secrets.
      KAFKA_LISTENERS: "CONTROLLER://:9093,INTERNAL://:9092,SASL_SSL://:9094"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,SASL_SSL://${KAFKA_PUBLIC_IP:?KAFKA_PUBLIC_IP must be set}:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:SASL_SSL,SASL_SSL:SASL_SSL"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_SECURITY_PROTOCOL: "SASL_SSL"
      KAFKA_SASL_ENABLED_MECHANISMS: "PLAIN"
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: "PLAIN"
      KAFKA_AUTHORIZER_CLASS_NAME: "org.apache.kafka.metadata.authorizer.StandardAuthorizer"
      # The combined KRaft controller uses the unexposed PLAINTEXT controller
      # listener and therefore registers as ANONYMOUS. Public clients remain
      # SASL-authenticated on the PUBLIC listener.
      KAFKA_SUPER_USERS: "User:admin;User:ANONYMOUS"
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/secrets/broker_jaas.conf"
      KAFKA_SSL_KEYSTORE_FILENAME: "kafka.keystore.p12"
      KAFKA_SSL_KEYSTORE_TYPE: "PKCS12"
      KAFKA_SSL_KEYSTORE_CREDENTIALS: "keystore-password"
      KAFKA_SSL_KEY_CREDENTIALS: "keystore-password"
      KAFKA_SSL_TRUSTSTORE_FILENAME: "kafka.truststore.p12"
      KAFKA_SSL_TRUSTSTORE_TYPE: "PKCS12"
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: "truststore-password"
      # The Apache image loads the truststore only for requested/required client
      # authentication. Requested keeps client certificates optional while allowing
      # Kafka's internal TLS validation to trust the broker certificate.
      KAFKA_SSL_CLIENT_AUTH: "requested"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --command-config /etc/kafka/secrets/admin.properties --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s