<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas Control Tower — FastAPI</title>
<style>
:root{font-family:system-ui,sans-serif;color:#172033;background:#f5f7fb}body{margin:0;max-width:1400px;padding:1.5rem;margin:auto}header,.row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}header{justify-content:space-between}.pill{padding:.25rem .6rem;border-radius:1rem;background:#dfe7f5}.ok{background:#cdeedc}.warn{background:#ffe9b0}.bad{background:#ffd5d5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:1rem;margin-top:1rem}.card{background:#fff;border:1px solid #dbe2ef;border-radius:.6rem;padding:1rem;box-shadow:0 1px 2px #17203312}.wide{grid-column:1/-1}h1,h2{margin:.1rem 0 .75rem}h1{font-size:1.4rem}h2{font-size:1rem}pre{white-space:pre-wrap;word-break:break-word;margin:0;max-height:25rem;overflow:auto;font-size:.78rem}input,select,button{padding:.45rem;border:1px solid #b6c1d5;border-radius:.3rem;background:white}button{cursor:pointer;background:#155eef;color:white;border-color:#155eef}button.secondary{background:white;color:#155eef}.muted{color:#58647a;font-size:.85rem}label{font-size:.85rem}#error{color:#a20d0d}
</style></head><body>
<header><div><h1>Atlas Control Tower <span class="muted">FastAPI</span></h1><div id="title" class="muted">Loading profiles…</div></div><div class="row"><label>Profile <select id="profile"></select></label><span id="connection" class="pill">connecting…</span><span id="stream" class="pill">stream: —</span></div></header>
<p id="error" role="alert"></p>
<main class="grid">
<section class="card"><h2>Entity overview</h2><pre id="overview"></pre></section>
<section class="card"><h2>Control tower KPIs</h2><button id="refreshKpis" class="secondary">Recompute</button><pre id="kpis"></pre></section>
<section class="card wide"><h2>Active load portfolio</h2><pre id="portfolio"></pre></section>
<section class="card"><h2>Exception queue</h2><pre id="exceptions"></pre></section>
<section class="card"><h2>Telemetry</h2><div class="row"><label>Min <input id="telMin" type="number" step="0.1"></label><label>Max <input id="telMax" type="number" step="0.1"></label><button id="telRefresh" class="secondary">Refresh</button><button id="telNormal" class="secondary">Add normal</button><button id="telExcursion">Add excursion</button></div><pre id="telemetry"></pre></section>
<section class="card wide"><h2>Operational search</h2><form id="search" class="row"><input id="query" placeholder="Search events and exceptions" required><select id="kind"><option value="all">events + exceptions</option><option value="events">events</option><option value="exceptions">exceptions</option></select><button>Search</button></form><pre id="results"></pre></section>
</main>
<script>
const $=id=>document.getElementById(id);let meta,profileId,refreshTimer;
const pretty=value=>JSON.stringify(value,null,2);const set=(id,value)=>$(id).textContent=pretty(value);
async function api(path,options={}){const response=await fetch(path,options);const data=await response.json().catch(()=>({detail:response.statusText}));if(!response.ok)throw Error(data.detail||data.error||response.statusText);return data}
function path(base,params={}){const query=new URLSearchParams({profile:profileId});for(const [key,value] of Object.entries(params))if(value!==''&&value!=null)query.set(key,value);return `${base}?${query}`}
function error(value=''){$('error').textContent=value}
async function refresh(fresh=false){if(!profileId)return;try{error();const [status,overview,portfolio,kpis,exceptions,telemetry]=await Promise.all([api('/api/status'),api(path('/api/overview')),api(path('/api/portfolio')),api(path('/api/kpis',{fresh:fresh?'true':''})),api(path('/api/exceptions')),api(path('/api/telemetry',{min:$('telMin').value,max:$('telMax').value}))]);$('connection').textContent=status.connected?'Atlas connected':'Atlas unavailable';$('connection').className=`pill ${status.connected?'ok':'bad'}`;set('overview',overview);set('portfolio',portfolio);set('kpis',kpis);set('exceptions',exceptions);set('telemetry',telemetry)}catch(e){error(e.message)}}
function queueRefresh(){clearTimeout(refreshTimer);refreshTimer=setTimeout(refresh,300)}
async function load(){try{meta=await api('/api/profiles');for(const profile of meta.profiles){const option=document.createElement('option');option.value=profile.id;option.textContent=profile.label;$('profile').append(option)}profileId=meta.defaultProfile;$('profile').value=profileId;$('profile').onchange=()=>{profileId=$('profile').value;const current=meta.profiles.find(p=>p.id===profileId);$('title').textContent=current.title;$('telMin').value=current.telemetry?.min??'';$('telMax').value=current.telemetry?.max??'';refresh()};$('profile').onchange();const stream=new EventSource('/api/stream');stream.addEventListener('stream-status',event=>{const state=JSON.parse(event.data);$('stream').textContent=`stream: ${state.state}`;$('stream').className=`pill ${state.state==='live'?'ok':state.state==='unavailable'?'bad':'warn'}`});stream.addEventListener('change',queueRefresh);stream.addEventListener('resync',refresh);stream.onerror=()=>{$('stream').textContent='stream: browser reconnecting';$('stream').className='pill warn'}}catch(e){error(e.message)}}
$('refreshKpis').onclick=()=>refresh(true);$('telRefresh').onclick=()=>refresh();$('telNormal').onclick=async()=>{await api(path('/api/telemetry/reading'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'normal'})});refresh()};$('telExcursion').onclick=async()=>{await api(path('/api/telemetry/reading'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'excursion'})});refresh()};$('search').onsubmit=async event=>{event.preventDefault();try{set('results',await api(path('/api/search',{q:$('query').value,kind:$('kind').value})))}catch(e){error(e.message)}};load();
</script></body></html>
